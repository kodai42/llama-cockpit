[project]
name = "llama-cockpit"
version = "0.1.0"
description = "Browser dashboard and backend for launching llama.cpp"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "requests>=2.31",
]

[dependency-groups]
dev = [
    "black>=24.0",
    "flake8>=7.0",
    "flake8-pyproject>=1.2.4",
    "pytest>=8.0",
]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.flake8]
max-line-length = 88
exclude = [".venv"]
extend-ignore = ["E203", "E501", "F824", "F541"]

[tool.pytest.ini_options]
testpaths = ["tests"]
