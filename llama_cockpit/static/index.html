<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Llama Cockpit</title>
<style>
:root {
  --bg:        #0b0c0f;
  --panel:     #10121a;
  --panel2:    #13151f;
  --border:    #1e2235;
  --border-hi: #2e3555;
  --accent:    #4f8ef7;
  --green:     #32d4a4;
  --warn:      #f0a04a;
  --danger:    #e05555;
  --text:      #c8cfe8;
  --text-dim:  #4a5070;
  --text-mid:  #7880a0;
  --topbar-h:  48px;
  --col-models: 340px;
  --col-params: 720px;
  --col-logs:   1fr;
  --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace;
  --sans: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 13px; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); }

.topbar {
  position: fixed; top: 0; left: 0; right: 0; height: var(--topbar-h);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 14px; background: var(--panel); border-bottom: 1px solid var(--border); z-index: 50;
}
.topbar-title { font-family: var(--mono); font-size: 12px; color: var(--accent); letter-spacing: 2px; transition: color .3s; }
.topbar-title.offline { color: var(--danger); }

.status-pills { display: flex; gap: 6px; }
.pill { display: flex; align-items: center; gap: 4px; font-family: var(--mono); font-size: 9px; padding: 2px 7px; border: 1px solid var(--border-hi); color: var(--text-dim); transition: .2s; }
.pill.active { border-color: var(--green); color: var(--green); }
.pill .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.pill.active .dot { box-shadow: 0 0 5px var(--green); }

.left-panel,
.mid-panel,
.right-panel {
  background: var(--panel);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-height: 0;
}
.left-panel,
.mid-panel {
  border-right: 1px solid var(--border);
}
.right-panel {
  position: relative;
}


.left-panel  { grid-area: models; }
.mid-panel   { grid-area: params; }
.right-panel { grid-area: logs; }

.page-body {
  padding-top: var(--topbar-h);
  display: flex;
  flex-direction: column;
}

/* Mobile / narrow: one-column stacked layout */
@media (max-width: 1023px) {
  .page-body {
    display: flex;
    flex-direction: column;
    padding-top: var(--topbar-h);
  }

  .left-panel,
  .mid-panel,
  .right-panel {
    position: static;
    width: 100%;
    height: auto;
    margin: 0;
    border-right: none;
    min-width: 0;
  }

  .left-panel,
  .mid-panel {
    border-bottom: 1px solid var(--border);
  }

  #params-content { grid-template-columns: 1fr !important; }
  .log-output { height: 340px !important; flex: none !important; }
  #tab-logs { height: auto !important; flex: none !important; }
}

/* Medium: models + parameters visually merged left, logs on the right */
@media (min-width: 1024px) and (max-width: 1399px) {
  .page-body {
    display: grid;
    height: 100vh;
    overflow: hidden;
    padding-top: var(--topbar-h);
    grid-template-columns: minmax(520px, 58vw) minmax(360px, 1fr);
    grid-template-rows: minmax(240px, 34vh) minmax(0, 1fr);
    grid-template-areas:
      "models logs"
      "params logs";
  }

  .left-panel,
  .mid-panel,
  .right-panel {
    position: static;
    width: auto;
    height: auto;
    margin: 0;
    min-width: 0;
  }

  .left-panel {
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }

  .mid-panel {
    border-right: 1px solid var(--border);
  }

  .right-panel {
    border-right: none;
  }

  #params-content {
    grid-template-columns: 1fr;
  }
}

/* Desktop: true 3-column layout */
@media (min-width: 1400px) {
  .page-body {
    display: grid;
    height: 100vh;
    overflow: hidden;
    padding-top: var(--topbar-h);
    grid-template-columns: var(--col-models) var(--col-params) minmax(0, 1fr);
    grid-template-areas: "models params logs";
  }

  .left-panel,
  .mid-panel,
  .right-panel {
    position: static;
    width: auto;
    height: auto;
    margin: 0;
    min-width: 0;
  }

  .left-panel,
  .mid-panel {
    border-right: 1px solid var(--border);
  }
}

.section-label,
.panel-header {
  height: 38px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 0 12px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-dim);
  letter-spacing: 2px;
  text-transform: uppercase;
}
.panel-title {
  display: flex;
  align-items: center;
  min-width: 0;
  color: var(--text-dim);
}
.panel-actions {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-left: auto;
  min-width: 0;
}
.panel-header.tab-bar {
  display: flex;
}
.panel-header .tab {
  height: auto;
  padding: 0;
  border-bottom: none;
  letter-spacing: 2px;
}
.panel-header .tab.active {
  color: var(--text-dim);
  border-bottom-color: transparent;
}
.panel-header .tab:hover {
  color: var(--accent);
}
.model-list { flex: 1; min-height: 0; overflow-y: auto; padding: 0 8px 8px; display: flex; flex-direction: column; gap: 4px; }
@media (max-width: 1023px) { .model-list { flex: none; max-height: 220px; } }
.model-list::-webkit-scrollbar { width: 3px; } .model-list::-webkit-scrollbar-thumb { background: var(--border-hi); }

.model-card { padding: 8px 10px; border: 1px solid var(--border); background: var(--panel2); cursor: pointer; border-radius: 3px; position: relative; transition: .12s; }
.model-card:hover { border-color: var(--border-hi); background: #161927; }
.model-card.selected { border-color: var(--accent); background: #111929; }
.model-card.selected::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--accent); border-radius: 3px 0 0 3px; box-shadow: 0 0 8px var(--accent); }
.model-card.missing { opacity: .45; cursor: not-allowed; }
.model-name { font-family: var(--mono); font-size: 11px; color: var(--text); margin-bottom: 2px; }
.model-card.selected .model-name { color: var(--accent); }
.model-path { font-size: 9px; color: var(--text-dim); font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.model-meta { display: flex; justify-content: space-between; margin-top: 3px; }
.model-size { font-family: var(--mono); font-size: 9px; color: var(--text-mid); }
.model-badge { font-family: var(--mono); font-size: 9px; color: var(--danger); }
.model-remove { font-family: var(--mono); font-size: 9px; color: var(--text-dim); background: none; border: none; cursor: pointer; padding: 0; position: absolute; top: 6px; right: 8px; transition: color .1s; }
.model-remove:hover { color: var(--danger); }

/* --- Speculative Decoding Draft Styles --- */
.draft-btn { display: none; position: absolute; bottom: 6px; right: 8px; font-family: var(--mono); font-size: 9px; padding: 2px 6px; background: transparent; border: 1px solid var(--green); color: var(--green); cursor: pointer; border-radius: 2px; transition: .1s; }
.draft-btn:hover { background: rgba(50,212,164,.15); }
.model-list.show-draft-mode .draft-btn { display: block; }
.draft-badge { font-family: var(--mono); font-size: 9px; color: var(--green); margin-left: 6px; }
.model-card.draft-selected { border-color: var(--green); }
.model-card.draft-selected:not(.selected)::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--green); border-radius: 3px 0 0 3px; box-shadow: 0 0 8px var(--green); }
.model-card.draft-selected:not(.selected) .model-name { color: var(--green); }

.browse-btn { margin: 0 8px 4px; padding: 7px 10px; background: transparent; border: 1px dashed var(--border-hi); color: var(--text-dim); font-family: var(--mono); font-size: 10px; cursor: pointer; border-radius: 3px; display: flex; align-items: center; justify-content: center; gap: 6px; transition: .12s; }
.browse-btn:hover { border-color: var(--accent); color: var(--accent); }

.launch-section { flex-shrink: 0; padding: 8px 8px 10px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 7px; }
.launch-btn { width: 100%; padding: 10px; background: var(--accent); border: none; color: #fff; font-family: var(--mono); font-size: 12px; letter-spacing: 1px; cursor: pointer; border-radius: 3px; display: flex; align-items: center; justify-content: center; gap: 8px; transition: .15s; }
.launch-btn:hover:not(:disabled) { background: #6fa3ff; box-shadow: 0 0 16px rgba(79,142,247,.35); }
.launch-btn:disabled { opacity: .3; cursor: not-allowed; }
.launch-btn.running { background: var(--danger); }
.launch-btn.running:hover { background: #f07070; box-shadow: 0 0 16px rgba(224,85,85,.35); }
.save-params-btn { width: 100%; padding: 6px 0; background: none; border: 1px solid var(--border-hi); color: var(--text-dim); font-family: var(--mono); font-size: 10px; letter-spacing: 1px; cursor: pointer; transition: .15s; }
.save-params-btn:hover { border-color: var(--accent); color: var(--accent); }
.save-params-btn.saved { border-color: var(--green);  color: var(--green);  }
.url-panel {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin: 0 8px 4px;
  padding: 0;
  border-top: none;
  flex-shrink: 0;
}
.url-panel.hidden { display: none; }
.connections-title {
  padding: 2px 2px 1px;
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-dim);
}
.url-row { display: flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 10px; padding: 5px 9px; background: var(--panel2); border: 1px solid var(--border); border-radius: 3px; transition: border-color .2s, background .2s; }
.url-row.active { background: rgba(50,212,164,.07); border-color: rgba(50,212,164,.25); }
.url-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-dim); flex-shrink: 0; transition: background .2s; }
.url-row.active .url-dot { background: var(--green); box-shadow: 0 0 5px var(--green); animation: pulse 2s infinite; }
.url-label { color: var(--text-dim); min-width: 34px; font-size: 9px; letter-spacing: 1px; }
.url-link { flex: 1; color: var(--text-dim); text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color .2s; pointer-events: none; }
.url-row.active .url-link { color: var(--green); pointer-events: auto; }
.url-link:hover { text-decoration: underline; }
.url-copy-btn { background: none; border: none; color: var(--text-dim); font-size: 13px; cursor: pointer; padding: 0 2px; transition: color .1s; opacity: 0; }
.url-row.active .url-copy-btn { opacity: 1; }
.url-copy-btn:hover { color: var(--green); }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(50,212,164,.5); } 50% { box-shadow: 0 0 0 4px rgba(50,212,164,0); } }

.tab-bar { display: flex; border-bottom: 1px solid var(--border); background: var(--panel); flex-shrink: 0; }
.tab { padding: 0 16px; height: 38px; display: flex; align-items: center; font-family: var(--mono); font-size: 10px; letter-spacing: 1px; color: var(--text-dim); cursor: pointer; border-bottom: 2px solid transparent; transition: .12s; user-select: none; }
.tab:hover { color: var(--text-mid); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

#tab-params { flex: 1; overflow-y: auto; padding: 14px; position: relative; }
#tab-params::-webkit-scrollbar { width: 4px; } #tab-params::-webkit-scrollbar-thumb { background: var(--border-hi); }
#tab-params.locked {
  opacity: 0.5;
  filter: grayscale(80%);
}

#tab-params.locked input,
#tab-params.locked select,
#tab-params.locked textarea,
#tab-params.locked button,
#tab-params.locked .mode-btn,
#tab-params.locked .seg-btn,
#tab-params.locked .toggle {
  pointer-events: none;
}
#params-save-bar { position: sticky; bottom: 0; background: var(--panel); border-top: 1px solid var(--border); padding: 10px 14px; }
.params-placeholder { text-align: center; padding: 40px; color: var(--text-dim); font-family: var(--mono); font-size: 12px; }
#params-content { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-content: start; margin-bottom: 16px; }
.param-group.full-width {
  grid-column: 1 / -1;
}

.param-group {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 3px;
  overflow: hidden;
}

.param-group-title {
  padding: 5px 12px;
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 2px;
  color: var(--text-dim);
  background: var(--panel2);
  border-bottom: 1px solid var(--border);
  text-transform: uppercase;
}

.param-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  gap: 8px;
}

.param-row:last-child {
  border-bottom: none;
}
[data-draft-only] { transition: opacity .2s; }
.spec-not-draft [data-draft-only] { opacity: 0.35; pointer-events: none; }
.param-label { font-size: 12px; color: var(--text); flex: 1; min-width: 0; }
.param-hint { font-family: var(--mono); font-size: 9px; color: var(--text-dim); margin-top: 2px; }

.num-input-plain { width: 70px; height: 28px; background: #0d0f18; border: 1px solid var(--border-hi); border-radius: 3px; color: var(--accent); font-family: var(--mono); font-size: 11px; text-align: center; outline: none; }
.num-input-plain:focus { border-color: var(--accent); }

.slider-wrap, .gpu-offload-wrap { display: flex; align-items: center; gap: 8px; flex: 1; justify-content: flex-end; }

.slider-wrap input[type=range], .gpu-offload-wrap input[type=range] { 
    -webkit-appearance: none; 
    appearance: none; 
    background: transparent; 
    width: 100%; 
    max-width: 350px; 
}

.slider-wrap input[type=range]::-webkit-slider-runnable-track, 
.gpu-offload-wrap input[type=range]::-webkit-slider-runnable-track { 
    width: 100%; 
    height: 4px; 
    background: var(--border-hi) !important; 
    border-radius: 3px; 
}

.slider-wrap input[type=range]::-moz-range-track, 
.gpu-offload-wrap input[type=range]::-moz-range-track { 
    width: 100%; 
    height: 4px; 
    background: var(--border-hi) !important; 
    border-radius: 3px; 
}


.slider-wrap input[type=range]::-webkit-slider-thumb, .gpu-offload-wrap input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 12px; width: 12px; border-radius: 50%; background: var(--accent); margin-top: -4px; cursor: pointer; }
.slider-wrap input[type=range]:disabled::-webkit-slider-thumb, .gpu-offload-wrap input[type=range]:disabled::-webkit-slider-thumb { background: var(--text-dim); }
.slider-val { font-family: var(--mono); font-size: 11px; color: var(--text); min-width: 36px; text-align: right; }
.all-layers-lbl { font-size: 10px; color: var(--text-dim); display: flex; align-items: center; gap: 4px; cursor: pointer; user-select: none; }

.seg-wrap { display: flex; align-items: center; gap: 4px; }
.seg-btn { background: var(--panel2); border: 1px solid var(--border-hi); color: var(--text); font-family: var(--mono); font-size: 11px; padding: 4px 8px; cursor: pointer; border-radius: 3px; transition: .1s; }
.seg-btn:hover { border-color: var(--accent); color: var(--accent); }
.seg-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

.num-input-plain::-webkit-inner-spin-button,
.num-input-plain::-webkit-outer-spin-button { -webkit-appearance: none; }
.num-input-plain { -moz-appearance: textfield; }

.toggle-wrap { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.toggle-lbl { font-family: var(--mono); font-size: 10px; color: var(--text-dim); min-width: 24px; text-align: right; }
.toggle { position: relative; width: 42px; height: 22px; cursor: pointer; }
.toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
.t-track { position: absolute; inset: 0; border-radius: 11px; background: #1a1e30; border: 1px solid var(--border-hi); transition: .2s; }
.toggle input:checked ~ .t-track { background: rgba(79,142,247,.18); border-color: var(--accent); }
.t-thumb { position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--text-dim); transition: .2s; }
.toggle input:checked ~ .t-track ~ .t-thumb { transform: translateX(20px); background: var(--accent); box-shadow: 0 0 6px var(--accent); }
.sel-ctrl { background: #0d0f18; border: 1px solid var(--border-hi); color: var(--accent); font-family: var(--mono); font-size: 11px; padding: 3px 6px; height: 28px; border-radius: 3px; outline: none; cursor: pointer; }
.sel-kvK,
.sel-kvV { width: 70px; }
.sel-ctrl:focus { border-color: var(--accent); }

#tab-logs { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.log-toolbar { display: flex; align-items: center; gap: 7px; padding: 0; border-bottom: none; background: transparent; flex-shrink: 0; }
.clear-btn { margin-left: 0; font-family: var(--mono); font-size: 10px; padding: 3px 10px; border: 1px solid var(--border); background: transparent; color: var(--text-dim); cursor: pointer; border-radius: 2px; }
.clear-btn:hover { color: var(--danger); border-color: var(--danger); }
.log-output { flex: 1; overflow-y: auto; padding: 10px 12px; font-family: var(--mono); font-size: 11px; line-height: 1.75; background: #080a10; border-top: none; }
.log-output::-webkit-scrollbar { width: 4px; } .log-output::-webkit-scrollbar-thumb { background: var(--border-hi); }
.log-line { display: block; white-space: pre-wrap; }
.log-line.info { color: #7a8fb0; } .log-line.ok { color: var(--green); } .log-line.warn { color: var(--warn); } .log-line.err { color: var(--danger); } .log-line.dim { color: var(--text-dim); }

.progress-overlay { display: none; position: absolute; inset: 0; background: rgba(8,9,16,.88); z-index: 20; align-items: center; justify-content: center; backdrop-filter: blur(3px); }
.progress-overlay.visible { display: flex; }
.progress-box { background: var(--panel); border: 1px solid var(--border-hi); border-radius: 4px; padding: 26px 32px; text-align: center; min-width: 280px; max-width: 90vw; }
.prog-title { font-family: var(--mono); font-size: 11px; color: var(--accent); margin-bottom: 6px; letter-spacing: 1px; }
.prog-sub { font-size: 11px; color: var(--text-dim); margin-bottom: 14px; }
.prog-bar-wrap { height: 3px; background: #1a1e30; border-radius: 2px; overflow: hidden; margin-bottom: 10px; }
.prog-bar-fill { height: 100%; background: var(--accent); width: 0%; transition: width .2s linear; box-shadow: 0 0 8px var(--accent); }
.prog-elapsed { font-family: var(--mono); font-size: 10px; color: var(--text-dim); }

.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(8,9,16,.92); z-index: 100; align-items: center; justify-content: center; padding: 16px; }
.modal-overlay.visible { display: flex; }
.modal { background: var(--panel); border: 1px solid var(--border-hi); border-radius: 4px; width: 100%; max-width: 560px; max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; }
.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--border); background: var(--panel2); flex-shrink: 0; }
.modal-title { font-family: var(--mono); font-size: 11px; color: var(--accent); letter-spacing: 1px; }
.modal-close { background: none; border: none; color: var(--text-dim); font-size: 18px; cursor: pointer; line-height: 1; padding: 0 2px; transition: .1s; }
.modal-close:hover { color: var(--text); }
.breadcrumb { padding: 8px 12px; border-bottom: 1px solid var(--border); font-family: var(--mono); font-size: 10px; color: var(--text-dim); background: #0c0e16; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0; }
.browser-list { flex: 1; overflow-y: auto; padding: 6px 0; }
.browser-list::-webkit-scrollbar { width: 4px; } .browser-list::-webkit-scrollbar-thumb { background: var(--border-hi); }
.browser-item { display: flex; align-items: center; gap: 10px; padding: 9px 14px; cursor: pointer; transition: .1s; border-bottom: 1px solid var(--border); }
.browser-item:last-child { border-bottom: none; }
.browser-item:hover { background: #161927; }
.browser-icon { font-size: 14px; flex-shrink: 0; width: 20px; text-align: center; }
.browser-name { flex: 1; font-size: 12px; color: var(--text); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.browser-size { font-family: var(--mono); font-size: 10px; color: var(--text-dim); flex-shrink: 0; }
.browser-item.is-file .browser-name { color: var(--accent); }
.browser-item.is-up .browser-name { color: var(--text-mid); font-style: italic; }
.browser-empty { padding: 24px 14px; text-align: center; font-size: 11px; color: var(--text-dim); font-family: var(--mono); }
.modal-footer { padding: 10px 14px; border-top: 1px solid var(--border); background: var(--panel2); flex-shrink: 0; font-family: var(--mono); font-size: 10px; color: var(--text-dim); }

.param-row.disabled,
.param-row.unsupported,
.pair-cell.unsupported {
  opacity: 0.35;
  pointer-events: none;
}
.param-row.unsupported .param-hint::after {
  content: " · unsupported";
  color: var(--danger);
}
.mode-wrap { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
.mode-btn {
  font-family: var(--mono);
  font-size: 9px;
  padding: 3px 6px;

</head>
<body>

  <section class="mid-panel">

<div class="toast" id="toast"></div>

<script>
"use strict";

const API = window.location.origin;

// ─── Parameter definitions ───────────────────────────────────────────────────

const KV_TYPES = ['f16','bf16','q8_0','q4_0','q5_0','q5_1'];

const GROUPS = [
  {
    title: "MODEL & CONTEXT",
    params: [
      { type:'auto_slider', label:'Context size', hint:'-c', key:'ctx', mode:'auto', val:8192, min:0, max:131072, step:512 },
      { type:'auto_gpu', label:'GPU offload', hint:'-ngl', key:'ngl', mode:'auto', val:999, min:0, max:99 },
      { type:'auto_numeric', label:'Parallel slots', hint:'-np', key:'parallel', mode:'auto', val:1, min:1, max:16, step:1 },
      { type:'auto_text', label:'Model alias', hint:'--alias', key:'alias', mode:'auto', val:'' },
      { type:'fixed_numeric', label:'llama-server port', hint:'--port', key:'llamaPort', val:8080, min:1, max:65535, step:1 },
      { type:'tri', label:'llama.cpp web UI', hint:'--ui', key:'llamaWebui', mode:'auto', cap:'ui' },
    ]
  },
  {
    title: "PERFORMANCE",
    params: [
      { type:'auto_numeric', label:'Batch size', hint:'-b', key:'batch', mode:'auto', val:2048, min:0, max:65536, step:64 },
      { type:'auto_numeric', label:'Micro-batch', hint:'-ub', key:'ubatch', mode:'auto', val:512, min:0, max:65536, step:64 },
      { type:'auto_slider', label:'CPU threads', hint:'-t', key:'threads', mode:'auto', val:8, min:0, max:32, step:1 },
      { type:'auto_slider', label:'Batch threads', hint:'-tb', key:'threadsBatch', mode:'auto', val:8, min:0, max:32, step:1, cap:'threadsBatch' },
      { type:'tri', label:'Flash Attention', hint:'-fa', key:'fa', mode:'auto' },
      { type:'tri', label:'Performance timings', hint:'--perf', key:'perf', mode:'auto', cap:'perf' },
    ]
  },
  {
    title: "MEMORY",
    params: [
      { type:'tri', label:'Memory map', hint:'--mmap', key:'mmap', mode:'auto', cap:'mmap' },
      { type:'tri', label:'Memory lock', hint:'--mlock', key:'mlock', mode:'auto', cap:'mlock' },
      { type:'tri', label:'Continuous batching', hint:'--cont-batching', key:'contBatching', mode:'auto', cap:'contBatching' },
      { type:'tri', label:'Direct I/O', hint:'--direct-io', key:'directIo', mode:'auto', cap:'directIo' },
      { type:'auto_select', label:'NUMA', hint:'--numa', key:'numa', mode:'auto', val:'distribute', options:['distribute','isolate','numactl'], cap:'numa' },
      { type:'auto_text', label:'Device', hint:'--device', key:'device', mode:'auto', val:'', cap:'device' },
    ]
  },
  {
    title: "CACHE",
    params: [
      { type:'auto_select', label:'KV cache K', hint:'--cache-type-k', key:'kvK', mode:'auto', val:'f16', options:KV_TYPES, cap:'kvCacheTypes' },
      { type:'auto_select', label:'KV cache V', hint:'--cache-type-v', key:'kvV', mode:'auto', val:'f16', options:KV_TYPES, cap:'kvCacheTypes' },
      { type:'tri', label:'KV unified', hint:'--kv-unified', key:'kvUnified', mode:'auto', cap:'kvUnified' },
      { type:'tri', label:'KV offload', hint:'--kv-offload', key:'kvOffload', mode:'auto', cap:'kvOffload' },
      { type:'tri', label:'Cache prompt', hint:'--cache-prompt', key:'cachePrompt', mode:'auto', cap:'cachePrompt' },
      { type:'auto_numeric', label:'Cache reuse', hint:'--cache-reuse', key:'cacheReuse', mode:'auto', val:0, min:0, max:131072, step:1, cap:'cacheReuse' },
    ]
  },
  {
    title: "SPECULATIVE DECODING",
    params: [
      { type:'auto_select', label:'Spec type', hint:'--spec-type', key:'specType', mode:'auto', val:'off', options:['off','draft','draft-mtp','lookup'], cap:'specType' },
      { type:'draft_model', label:'Draft model', hint:'--model-draft', key:'draftModelPath', specScope:['draft'] },
      { type:'auto_gpu', label:'Draft GPU offload', hint:'--n-gpu-layers-draft', key:'draftNgl', mode:'auto', val:999, min:0, max:99, specScope:['draft'], cap:'draftGpuLayers' },
      { type:'auto_numeric', label:'Draft tokens min', hint:'--spec-draft-n-min', key:'specDraftNMin', mode:'auto', val:0, min:0, max:32, step:1, specScope:['draft','draft-mtp'], cap:'specDraftMin' },
      { type:'auto_numeric', label:'Draft tokens max', hint:'--spec-draft-n-max', key:'specDraftNMax', mode:'auto', val:5, min:1, max:32, step:1, specScope:['draft','draft-mtp'], cap:'specDraftMax' },
      { type:'auto_num', label:'Draft probability min', hint:'--spec-draft-p-min', key:'specDraftPMin', mode:'auto', val:0.0, min:0, max:1, step:0.05, specScope:['draft','draft-mtp'], cap:'specDraftPMin' },
      { type:'auto_num', label:'Draft probability split', hint:'--spec-draft-p-split', key:'specDraftPSplit', mode:'auto', val:0.1, min:0, max:1, step:0.05, specScope:['draft','draft-mtp'], cap:'specDraftPSplit' },
      { type:'auto_select', label:'Draft cache K', hint:'--cache-type-k-draft', key:'specDraftCacheK', mode:'auto', val:'f16', options:KV_TYPES, specScope:['draft','draft-mtp'], cap:'specDraftCache' },
      { type:'auto_select', label:'Draft cache V', hint:'--cache-type-v-draft', key:'specDraftCacheV', mode:'auto', val:'f16', options:KV_TYPES, specScope:['draft','draft-mtp'], cap:'specDraftCache' },
    ]
  },
  {
    title: "SAMPLING DEFAULTS",
    params: [
      { type:'auto_num', label:'Temperature', hint:'--temp', key:'temp', mode:'auto', val:1.0, min:0, max:2, step:0.05 },
      { type:'auto_num', label:'Top P', hint:'--top-p', key:'topP', mode:'auto', val:1.0, min:0, max:1, step:0.01 },
      { type:'auto_numeric', label:'Top K', hint:'--top-k', key:'topK', mode:'auto', val:0, min:0, max:1000, step:1 },
      { type:'auto_num', label:'Min P', hint:'--min-p', key:'minP', mode:'auto', val:0.0, min:0, max:1, step:0.01 },
      { type:'auto_num', label:'Repeat penalty', hint:'--repeat-penalty', key:'repeatPenalty', mode:'auto', val:1.0, min:0, max:2, step:0.01 },
      { type:'auto_num', label:'Presence penalty', hint:'--presence-penalty', key:'presencePenalty', mode:'auto', val:0.0, min:-2, max:2, step:0.01 },
      { type:'auto_num', label:'Frequency penalty', hint:'--frequency-penalty', key:'frequencyPenalty', mode:'auto', val:0.0, min:-2, max:2, step:0.01 },
      { type:'auto_num', label:'RoPE freq base', hint:'--rope-freq-base', key:'ropeBase', mode:'auto', val:0, min:0, max:1000000, step:10000 },
      { type:'auto_num', label:'RoPE freq scale', hint:'--rope-freq-scale', key:'ropeScale', mode:'auto', val:0, min:0, max:10, step:0.1 },
    ]
  },
  {
    title: "OTHER PARAMETERS",
    className: "full-width",
    params: [
      { type:'tri_pair', label:'UI / template controls', hint:'--ui-mcp-proxy / --jinja', items:[
        { type:'tri', label:'ui-mcp-proxy', hint:'--ui-mcp-proxy', key:'uiMcpProxy', mode:'auto', cap:'uiMcpProxy' },
        { type:'tri', label:'Template engine', hint:'--jinja', key:'templateEngine', mode:'auto', cap:'jinja' },
      ] },
      { type:'ui_config_file', label:'UI config file', hint:'--ui-config-file', key:'uiConfigFile', mode:'off', val:'', cap:'uiConfigFile' },
      { type:'json_text', label:'Template kwargs', hint:'--chat-template-kwargs', key:'templateKwargs', val:'{}', cap:'chatTemplateKwargs' },
      { type:'arg_text', label:'Extra shell args', hint:'', key:'extraServerArgs', val:'' },
    ]
  },
  {
    title: "COMMAND PREVIEW",
    className: "full-width",
    params: [
      { type:'command_preview', label:'Generated command', hint:'Auto values are omitted', key:'commandPreview' },
    ]
  },
 ];

const APP_PARAMS = [];

const P = {};
const PARAMS = [];
function cloneVal(v) { return Array.isArray(v) ? [...v] : (v && typeof v === 'object' ? JSON.parse(JSON.stringify(v)) : v); }
function registerParam(p) {
  if (p.key && p.type !== 'command_preview' && p.type !== 'draft_model') {
    p.defaultVal = cloneVal(p.val);
    p.defaultMode = p.mode ?? null;
    P[p.key] = p;
    PARAMS.push(p);
  }
  if (Array.isArray(p.items)) {
    p.items.forEach(item => {
      item.defaultVal = cloneVal(item.val);
      item.defaultMode = item.mode ?? null;
      P[item.key] = item;
      PARAMS.push(item);
    });
  }
}
GROUPS.forEach(g => g.params.forEach(registerParam));
APP_PARAMS.forEach(registerParam);

// ─── App state ───────────────────────────────────────────────────────────────

const S = {
  models: [], selectedModel: null, draftModelPath: null,
  llamaRunning: false,
  logOffset: 0,
  localLogs: [],
  backendOnline: false,
  serverCapsOk: false,
  serverCapsPending: true,
  serverCapsError: null,
  serverCaps: {}, supports: {}, hasSupportMap: false,
  llamaUrl: null,
  llamaPort: 8080, cockpitUrl: API,
  commandPreview: 'Select a model to preview the launch command.',
  commandPreviewWarning: '',
};

// ─── API helpers ─────────────────────────────────────────────────────────────

async function apiFetch(path, opts = {}, timeoutMs = 15000) {
  const ctrl = new AbortController();
  const tid  = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const { signal: _discarded, ...restOpts } = opts;
    const r = await fetch(API + path, {
      headers: { 'Content-Type': 'application/json' },
      ...restOpts,
      signal: ctrl.signal,
    });
    if (!r.ok) {
      const body = await r.json().catch(() => ({}));
      throw new Error(body.error || `HTTP ${r.status}`);
    }
    return r.json();
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('Request timed out');
    throw e;
  } finally {
    clearTimeout(tid);
  }
}

// ─── Toast ───────────────────────────────────────────────────────────────────

let _toastTimer = null;
function showToast(msg, duration = 4500) {
  const el = document.getElementById('toast');
  el.textContent = '⚠ ' + msg;
  el.classList.add('visible');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove('visible'), duration);
}

function esc(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// ─── Model list ──────────────────────────────────────────────────────────────

async function loadModels() {
  try {
    S.models = await apiFetch('/api/models');
    S.backendOnline = true;
    renderModels();
    updateBtn();
  } catch(e) {
    document.getElementById('model-list').innerHTML =
      `<div style="color:var(--danger);font-size:10px;font-family:var(--mono);padding:8px 4px;">Backend offline.</div>`;
  }
}

function renderModels() {
  const el = document.getElementById('model-list');
  if (S.models.length === 0) {
    el.innerHTML = `<div style="color:var(--text-dim);font-size:10px;font-family:var(--mono);padding:8px 4px;">No models added. Click Browse.</div>`;
    return;
  }
  el.classList.toggle('show-draft-mode', currentSpecType() === 'draft');
  el.innerHTML = S.models.map((m, i) => {
    const isDraft = m.path === S.draftModelPath;
    return `
    <div class="model-card ${i === S.selectedModel ? 'selected' : ''} ${isDraft ? 'draft-selected' : ''} ${!m.exists ? 'missing' : ''}"
         data-model-index="${i}" role="button" tabindex="0">
      <button class="model-remove" data-remove-path="${esc(m.path)}" title="Remove model">✕</button>
      <div class="model-name">${esc(m.name)}</div>
      <div class="model-path">${esc(m.path)}</div>
      <div class="model-meta">
        <span class="model-size">${m.size_mb != null ? m.size_mb + ' MB' : ''}</span>
        ${!m.exists ? '<span class="model-badge">file not found</span>' : ''}
        ${isDraft ? '<span class="draft-badge">[DRAFT]</span>' : ''}
      </div>
      <button class="draft-btn" data-draft-path="${esc(m.path)}" title="Use as draft model">DRAFT</button>
    </div>`;
  }).join('');
}

document.getElementById('model-list').addEventListener('click', async e => {
  const removeBtn = e.target.closest('[data-remove-path]');
  if (removeBtn) { e.stopPropagation(); await removeModel(removeBtn.dataset.removePath); return; }

  const draftBtn = e.target.closest('[data-draft-path]');
  if (draftBtn) {
    e.stopPropagation();
    S.draftModelPath = draftBtn.dataset.draftPath;
    renderModels();
    renderParams();
    updateBtn();
    queueCommandPreview();
    return;
  }

  const card = e.target.closest('[data-model-index]');
  if (card) {
    const i = parseInt(card.dataset.modelIndex, 10);
    if (S.models[i]?.exists) selectModel(i);
  }
});

async function selectModel(i) {
  if (!S.models[i]?.exists) return;
  S.selectedModel = i;
  localStorage.setItem('llamaCockpitSelectedModel', S.models[i].path);
  renderModels();

  try {
    const info = await apiFetch(`/api/model_info?path=${encodeURIComponent(S.models[i].path)}`);
    if (info.context_length && P.ctx) {
      P.ctx.max = info.context_length;
      if (P.ctx.mode === 'custom') P.ctx.val = Math.min(P.ctx.val, info.context_length);
    }
    if (info.block_count && P.ngl) P.ngl.max = info.block_count;
  } catch(_) { /* use existing defaults */ }

  await loadParamsForModel(S.models[i].path);
  renderParams();
  updateBtn();
  queueCommandPreview();
}

async function removeModel(path) {
  try {
    await apiFetch('/api/remove_model', { method: 'POST', body: JSON.stringify({ path }) });
    if (S.models[S.selectedModel]?.path === path) S.selectedModel = null;
    if (S.draftModelPath === path) S.draftModelPath = null;
    await loadModels();
    renderParams();
    queueCommandPreview();
  } catch(e) { showToast(e.message); }
}

// ─── File browser modal ───────────────────────────────────────────────────────

let browserMode = 'model';

function openBrowser(mode = 'model') {
  browserMode = mode;
  document.getElementById('modal-title').textContent = mode === 'config' ? 'SELECT CONFIG FILE' : 'SELECT MODEL FILE';
  document.getElementById('modal-footer').innerHTML = mode === 'config'
    ? 'Click a file to use it as <span style="color:var(--accent)">--ui-config-file</span>.'
    : 'Click a <span style="color:var(--accent)">.gguf</span> file to add it as a model.';
  document.getElementById('modal-overlay').classList.add('visible');
  browseTo(null);
}
function closeBrowser() { document.getElementById('modal-overlay').classList.remove('visible'); }
function openConfigBrowser() {
  const p = P.uiConfigFile;
  if (!p || capUnsupported(p) || p.mode !== 'on') return;
  openBrowser('config');
}

async function browseTo(path) {
  const query = new URLSearchParams();
  query.set('kind', browserMode === 'config' ? 'config' : 'model');
  if (path) query.set('path', path);
  const url  = `/api/browse?${query.toString()}`;
  const list = document.getElementById('browser-list');
  list.innerHTML = `<div class="browser-empty">Loading…</div>`;
  try {
    const data = await apiFetch(url);
    document.getElementById('browser-path').textContent = data.path;

    const frag = document.createDocumentFragment();
    if (data.parent) {
      const up = document.createElement('div');
      up.className = 'browser-item is-up';
      up.dataset.browseDir = data.parent;
      up.innerHTML = `<span class="browser-icon">↑</span><span class="browser-name">.. (up)</span>`;
      frag.appendChild(up);
    }
    for (const d of data.dirs) {
      const el = document.createElement('div');
      el.className = 'browser-item is-dir';
      el.dataset.browseDir = d.path;
      el.innerHTML = `<span class="browser-icon">📁</span><span class="browser-name">${esc(d.name)}</span>`;
      frag.appendChild(el);
    }
    for (const f of data.files) {
      const el = document.createElement('div');
      el.className = 'browser-item is-file';
      if (browserMode === 'config') {
        el.dataset.configFile = f.path;
        el.innerHTML = `<span class="browser-icon">📄</span><span class="browser-name">${esc(f.name)}</span><span class="browser-size">${f.size_mb != null ? f.size_mb + ' MB' : ''}</span>`;
      } else {
        el.dataset.addFile = f.path;
        el.dataset.addName = f.name;
        el.innerHTML = `<span class="browser-icon">🧠</span><span class="browser-name">${esc(f.name)}</span><span class="browser-size">${f.size_mb != null ? f.size_mb + ' MB' : ''}</span>`;
      }
      frag.appendChild(el);
    }
    list.innerHTML = '';
    if (frag.childElementCount === 0) list.innerHTML = `<div class="browser-empty">Empty directory.</div>`;
    else list.appendChild(frag);
  } catch(e) {
    list.innerHTML = `<div class="browser-empty" style="color:var(--danger)">${esc(e.message)}</div>`;
  }
}

document.getElementById('browser-list').addEventListener('click', async e => {
  const item = e.target.closest('.browser-item');
  if (!item) return;
  if (item.dataset.browseDir !== undefined) browseTo(item.dataset.browseDir);
  else if (item.dataset.configFile !== undefined) setUiConfigFilePath(item.dataset.configFile);
  else if (item.dataset.addFile !== undefined) await addModelFromBrowser(item.dataset.addFile, item.dataset.addName);
});

async function addModelFromBrowser(path, name) {
  try {
    await apiFetch('/api/add_model', { method: 'POST', body: JSON.stringify({ path, name }) });
    closeBrowser();
    await loadModels();
    const idx = S.models.findIndex(m => m.path === path);
    if (idx >= 0) selectModel(idx);
  } catch(e) { showToast(e.message); }
}

function capUnsupported(p) {
  if (!p?.cap || !S.hasSupportMap) return false;
  return S.supports[p.cap] === false;
}

let _capsPollTimer = null;

function applyServerCaps(caps) {
  const oldOk = S.serverCapsOk;
  const oldPending = S.serverCapsPending;
  const oldSupports = JSON.stringify(S.supports || {});

  S.serverCaps = caps || {};
  S.supports = S.serverCaps.supports || {};
  S.hasSupportMap = Object.keys(S.supports).length > 0;
  S.serverCapsPending = S.serverCaps.pending === true;
  S.serverCapsOk = S.serverCaps.ok === true && !S.serverCapsPending;
  S.serverCapsError = S.serverCaps.error || (S.serverCapsPending ? 'Checking llama-server capabilities…' : null);

  const supportsChanged = oldSupports !== JSON.stringify(S.supports || {});
  if (supportsChanged && S.selectedModel !== null) renderParams();
  if (oldOk !== S.serverCapsOk || oldPending !== S.serverCapsPending) updateBtn();
}

async function refreshServerCaps() {
  clearTimeout(_capsPollTimer);
  try {
    const caps = await apiFetch('/api/server_caps');
    applyServerCaps(caps);
  } catch(_) {
    S.serverCapsOk = false;
    S.serverCapsPending = false;
    S.serverCapsError = 'Could not reach backend to verify llama-server version.';
    updateBtn();
    return;
  }
  if (S.serverCapsPending) {
    _capsPollTimer = setTimeout(refreshServerCaps, 600);
  }
}

function refreshSimpleControl(key) {

  document.querySelectorAll(`[data-mode-key="${key}"]`).forEach(btn => {
    btn.classList.toggle('active', (p.mode || p.val) === btn.dataset.modeVal);
    btn.classList.toggle('auto-inactive', btn.dataset.modeVal === 'auto' && p.mode !== 'auto');
  });
  const out = document.getElementById('out_' + key);
  if (out) out.textContent = displayVal(p);
  const lbl = document.getElementById('lbl_' + key);
  if (lbl && p.type === 'tri') lbl.textContent = p.mode === 'auto' ? '' : (p.mode === 'on' ? 'ON' : 'OFF');
  const ctrl = document.getElementById('ctrl_' + key);
  if (ctrl) ctrl.classList.toggle('auto-muted', p.mode === 'auto');
  const inp = document.getElementById('inp_' + key);
  if (inp && inp.tagName === 'SELECT') inp.value = (p.mode === 'auto' || valueMissing(p.val)) ? '' : p.val;
  else if (inp && inp.type === 'number') inp.value = displayVal(p);
  else if (inp && inp.type === 'text') inp.value = p.mode === 'auto' ? '' : (p.val || '');

function blankValueFor(p) {

function clampValue(p, value, floaty=false) {
  if (value === '' || value === null || value === undefined) return null;
  let v = floaty ? parseFloat(value) : parseInt(value, 10);
  if (isNaN(v)) return null;
  if (p.min !== undefined) v = Math.max(Number(p.min), v);

  if (floaty && p.step && p.step < 1) v = parseFloat(v.toFixed(4));

}
function setMode(key, mode) {
  const p = P[key];
  if (!p) return;
  if (mode === 'auto') {
    if (p.mode === 'auto') {
      // Clicking active Auto means: stop omitting the flag and ask the user for a value.
      if (p.type === 'tri') {
        p.mode = 'off';
      } else {
        p.mode = 'custom';
        p.val = blankValueFor(p);
      }
    } else {
      // Re-enable Auto: restore default UI state and omit the flag again.
      p.mode = 'auto';
      p.val = cloneVal(p.defaultVal);
      if (p._prevVal !== undefined) delete p._prevVal;
    }
    changed(true);
    return;
  }
  p.mode = mode;
  refreshSimpleControl(key);
  changed(false);
}

    const inp = document.getElementById('inp_' + key);
    if (inp) inp.value = displayVal(p);

function copyUrl(linkId) {
  const el = document.getElementById(linkId);
  if (!el) return;
  navigator.clipboard.writeText(el.href).then(() => {
    const btn = el.nextElementSibling;
    const orig = btn.textContent;
    btn.textContent = '✓';
    setTimeout(() => btn.textContent = orig, 1500);
  }).catch(() => showToast('Could not copy URL.'));
}

  if (!st) return;

  if (st.cockpit?.url) S.cockpitUrl = st.cockpit.url;
  if (st.llama?.port != null) S.llamaPort = st.llama.port;
  if (st.llama?.url) S.llamaUrl = st.llama.url;
}

  if (st) applyStatus(st);
  const llamaPort = st?.llama?.port ?? S.llamaPort ?? Number(P.llamaPort?.val || 8080);
  const llamaUrl = st?.llama?.url ?? S.llamaUrl ?? `http://127.0.0.1:${llamaPort}`;

  const rowLlama = document.getElementById('url-row-llama');
  const linkLlama = document.getElementById('url-link-llama');
  rowLlama.classList.toggle('active', S.llamaRunning);

function parseTemplateKwargs() {
  const raw = String(P.templateKwargs?.val || '').trim();

  const parsed = JSON.parse(raw);

  return parsed;
}
function blockedExtraArg(text) {
  const blocked = ['-m','--model','--host','--port','--chat-template-kwargs'];
  return blocked.find(flag => new RegExp(`(^|\\s)${flag.replace(/[-]/g, '\\$&')}(\\s|$)`).test(text));
}
function collectParams() {
  if (S.selectedModel === null) throw new Error('Select a model first.');

  const templateKwargs = capUnsupported(P.templateKwargs) ? {} : parseTemplateKwargs();
  const extraArgs = String(P.extraServerArgs?.val || '').trim();
  const blocked = blockedExtraArg(extraArgs);
  if (blocked) throw new Error(`Extra shell args include blocked flag: ${blocked}`);

  return {
    model_path: S.models[S.selectedModel].path,

    ctx: modeEntry('ctx'), ngl: modeEntry('ngl'), parallel: modeEntry('parallel'), alias: modeEntry('alias'),
    llamaPort: valueMissing(P.llamaPort?.val) ? null : Number(P.llamaPort.val),
    llamaWebui: triEntry('llamaWebui'),
    batch: modeEntry('batch'), ubatch: modeEntry('ubatch'), threads: modeEntry('threads'), threadsBatch: modeEntry('threadsBatch'),
    fa: triEntry('fa'), perf: triEntry('perf'),
    mmap: triEntry('mmap'), mlock: triEntry('mlock'), contBatching: triEntry('contBatching'), directIo: triEntry('directIo'),
    numa: modeEntry('numa'), device: modeEntry('device'),
    kvK: modeEntry('kvK'), kvV: modeEntry('kvV'), kvUnified: triEntry('kvUnified'), kvOffload: triEntry('kvOffload'),
    cachePrompt: triEntry('cachePrompt'), cacheReuse: modeEntry('cacheReuse'),

    specType: modeEntry('specType'), draftModelPath: S.draftModelPath,
    draftNgl: modeEntry('draftNgl'), specDraftNMin: modeEntry('specDraftNMin'), specDraftNMax: modeEntry('specDraftNMax'),
    specDraftPMin: modeEntry('specDraftPMin'), specDraftPSplit: modeEntry('specDraftPSplit'),
    specDraftCacheK: modeEntry('specDraftCacheK'), specDraftCacheV: modeEntry('specDraftCacheV'),

    temp: modeEntry('temp'), topP: modeEntry('topP'), topK: modeEntry('topK'), minP: modeEntry('minP'),
    repeatPenalty: modeEntry('repeatPenalty'), presencePenalty: modeEntry('presencePenalty'), frequencyPenalty: modeEntry('frequencyPenalty'),
    ropeBase: modeEntry('ropeBase'), ropeScale: modeEntry('ropeScale'),

    other: {
      uiMcpProxy: triEntry('uiMcpProxy'),
      uiConfigFile: uiConfigFileEntry(),
      templateEngine: P.templateEngine?.mode || 'auto',
      templateKwargs,
      extraArgs,
    },
  };
}
function missingEntry(entry) {
  return entry && entry.mode === 'custom' && valueMissing(entry.value);
}
function validateParams(params) {
  const spec = params.specType;
  if (spec?.mode === 'custom' && valueMissing(spec.value)) {
    return { ok:false, error:'Spec type needs a value. Select a speculative decoding type or re-enable Auto.' };
  }
  if (spec?.mode === 'custom' && spec.value === 'draft' && !params.draftModelPath) {
    return { ok:false, error:'Draft model required for Draft speculative decoding.' };
  }
  if (valueMissing(params.llamaPort)) {
    return { ok:false, error:'llama-server port is required.' };
  }
  const llamaPort = Number(params.llamaPort);
  if (!Number.isInteger(llamaPort) || llamaPort < 1 || llamaPort > 65535) {
    return { ok:false, error:'llama-server port must be an integer between 1 and 65535.' };
  }
  if (llamaPort === 5000) {
    return { ok:false, error:'llama-server port 5000 is used by Llama Cockpit. Choose another port.' };
  }
  if (P.uiConfigFile?.mode === 'on' && valueMissing(P.uiConfigFile.val)) {
    return { ok:false, error:'UI config file is enabled, but no config file was selected. Select a config file or switch it off.' };
  }
  for (const p of PARAMS) {
    if (!p.key || p.type === 'app_bool' || p.type === 'tri' || p.type === 'json_text' || p.type === 'arg_text' || p.type === 'ui_config_file') continue;
    if (capUnsupported(p)) continue;
    if (p.specScope) {
      const specType = currentSpecType();
      if (!(P.specType?.mode === 'custom' && p.specScope.includes(specType))) continue;
    }
    if (p.mode === 'custom' && valueMissing(p.val)) {
      return { ok:false, error:`${p.label} needs a value. Enter a value or re-enable Auto.` };
    }
  }
  return { ok:true };
}

async function saveParams() {
  if (S.selectedModel === null) return;
  const modelPath = S.models[S.selectedModel].path;
  let params;
  try { params = collectParams(); }
  catch(e) { showToast('Cannot save parameters: ' + e.message); return; }
  delete params.model_path;
  try {
    await apiFetch('/api/params', { method: 'POST', body: JSON.stringify({ model_path: modelPath, params }) });
    const btn = document.getElementById('save-params-btn');
    btn.textContent = '✓  SAVED';
    btn.classList.add('saved');
    setTimeout(() => { btn.textContent = '💾  SAVE PARAMETERS'; btn.classList.remove('saved'); }, 2000);
  } catch(e) { showToast('Failed to save parameters: ' + e.message); }
}

async function clearParameters() {
  if (S.selectedModel === null) return;
  const modelPath = S.models[S.selectedModel].path;
  try {
    await apiFetch('/api/clear_params', { method: 'POST', body: JSON.stringify({ model_path: modelPath }) });
    resetParamsToDefaults();
    S.draftModelPath = null;
    await selectModel(S.selectedModel);
    const btn = document.getElementById('clear-params-btn');
    btn.textContent = '✓  CLEARED';
    btn.classList.add('saved');
    setTimeout(() => { btn.textContent = '✕  CLEAR PARAMETERS'; btn.classList.remove('saved'); }, 2000);
  } catch(e) { showToast('Failed to clear parameters: ' + e.message); }
}
function resetParamsToDefaults() {
  PARAMS.forEach(p => {
    p.val = cloneVal(p.defaultVal);
    if (p.defaultMode !== null) p.mode = p.defaultMode;
    if (p._prevVal !== undefined) delete p._prevVal;
  });
}
function applySavedEntry(key, value) {
  const p = P[key];
  if (!p) return;
  if (p.type === 'app_bool' || key === 'templateKwargs' || key === 'extraServerArgs') {
    p.val = value;
    return;
  }
  if (p.type === 'ui_config_file') {
    if (value && typeof value === 'object') {
      p.mode = value.mode === 'on' ? 'on' : 'off';
      p.val = value.value || '';
    } else {
      p.mode = 'off';
      p.val = value || '';
    }
    return;
  }
  if (value && typeof value === 'object' && 'mode' in value) {
    p.mode = value.mode;
    if ('value' in value) p.val = value.value;
  } else {
    p.val = value;
    if (p.type === 'tri' && typeof value === 'boolean') p.mode = value ? 'on' : 'off';
    else if (p.mode !== undefined) p.mode = 'custom';
  }
}
async function loadParamsForModel(modelPath) {
  resetParamsToDefaults();
  try {
    const saved = await apiFetch('/api/params?path=' + encodeURIComponent(modelPath));
    if (saved && Object.keys(saved).length > 0) {
      Object.entries(saved).forEach(([key, val]) => {
        if (key === '_migrated') return;
        if (key === 'other' && val && typeof val === 'object') {
          const mcp = val.uiMcpProxy || { mode: 'auto' };
          const cfg = val.uiConfigFile || { mode: 'off', value: '' };
          P.uiMcpProxy.mode = mcp.mode || 'auto';
          P.uiConfigFile.mode = cfg.mode === 'on' ? 'on' : 'off';
          P.uiConfigFile.val = cfg.value || '';
          P.templateEngine.mode = val.templateEngine || 'auto';
          P.templateKwargs.val = JSON.stringify(val.templateKwargs || {});
          P.extraServerArgs.val = val.extraArgs || '';
          return;
        }
        if (key === 'draftModelPath') { S.draftModelPath = val || null; return; }
        applySavedEntry(key, val);
      });
      if (saved._migrated) showToast('This profile was migrated from old fixed defaults. Use Clear Parameters for minimal Auto launch.', 6500);
    }
  } catch(_) { /* non-fatal — use defaults if load fails */ }
}

// ─── Tabs ────────────────────────────────────────────────────────────────────

document.querySelectorAll('.tab-bar').forEach(bar => {
  bar.addEventListener('click', e => {
    const tab = e.target.closest('[data-tab]');
    if (tab) switchTab(tab.dataset.tab);
  });
});
function switchTab(which) {
  const isDesktop = window.matchMedia('(min-width: 1024px)').matches;
  if (isDesktop) { renderLog(); return; }
  document.getElementById('tab-btn-params').classList.toggle('active', which === 'params');
  document.getElementById('tab-btn-logs').classList.toggle('active', which === 'logs');
  document.getElementById('tab-params').style.display = which === 'params' ? 'block' : 'none';
  document.getElementById('tab-logs').style.display = which === 'logs' ? 'flex' : 'none';
  if (which === 'logs') renderLog();
}

// ─── Logs ────────────────────────────────────────────────────────────────────

function isNearLogBottom(el, margin = 32) {
  return el.scrollHeight - el.scrollTop - el.clientHeight <= margin;
}
function appendLogLines(lines, { forceBottom = false } = {}) {
  const el = document.getElementById('log-output');
  const shouldStickToBottom = forceBottom || isNearLogBottom(el);

  for (const l of lines) {
    const row = document.createElement('span');
    row.className = `log-line ${l.cls || 'dim'}`;
    row.textContent = `[${l.t}] ${l.text ?? ''}`;
    el.appendChild(row);
  }

  if (shouldStickToBottom) {
    el.scrollTop = el.scrollHeight;
  }
}
function renderLog({ forceBottom = false } = {}) {
  const el = document.getElementById('log-output');
  el.innerHTML = '';
  appendLogLines(S.localLogs, { forceBottom });
}
document.querySelector('.log-toolbar').addEventListener('click', e => {
  if (e.target.id === 'log-clear-btn') clearLocalLog();
});
function clearLocalLog() {
  S.localLogs = [];
  S.logOffset = 0;
  renderLog({ forceBottom: true });
}

// ─── Polling loops ────────────────────────────────────────────────────────────

async function loopStatus() {
  try {
    const st = await apiFetch('/api/status');
    S.backendOnline = true;
    const wasRunning = S.llamaRunning;
    applyStatus(st);
    if (wasRunning && !S.llamaRunning) hideProgress();
    updateBtn();
    document.getElementById('topbar-title').classList.remove('offline');
    document.getElementById('pill-llama').classList.toggle('active', S.llamaRunning);
    updateUrlPanel(st);
    document.getElementById('tab-params').classList.toggle('locked', S.llamaRunning);
  } catch(_) {
    S.backendOnline = false;
    updateBtn();
    document.getElementById('topbar-title').classList.add('offline');
  }
  setTimeout(loopStatus, S.backendOnline ? 3000 : 10000);
}
async function loopLogs() {
  if (S.backendOnline) {
    try {
      const data = await apiFetch(`/api/logs?since=${S.logOffset}`);
      if (data.total < S.logOffset) {
        S.localLogs = [];
        S.logOffset = 0;
        const fresh = await apiFetch('/api/logs?since=0');
        if (fresh.lines.length > 0) {
          S.localLogs.push(...fresh.lines);
          S.logOffset = fresh.total;
          renderLog({ forceBottom: true });
        }
      } else if (data.lines.length > 0) {
        S.localLogs.push(...data.lines);
        S.logOffset = data.total;

        const isDesktop = window.matchMedia('(min-width: 1024px)').matches;
        if (isDesktop || document.getElementById('tab-btn-logs').classList.contains('active')) {
          appendLogLines(data.lines);
        }
      }
    } catch(_) {}
  }
  setTimeout(loopLogs, S.backendOnline ? 1000 : 10000);
}

// ─── Launch / stop ───────────────────────────────────────────────────────────

document.getElementById('launch-btn').addEventListener('click', () => {
  S.llamaRunning ? doStop() : doLaunch();
});
function updateBtn() {
  const btn = document.getElementById('launch-btn');
  const specIsDraft = P.specType?.mode === 'custom' && P.specType?.val === 'draft';
  const draftMissing = specIsDraft && !S.draftModelPath;
  const capsBlocked = !S.llamaRunning && !S.serverCapsOk;
  btn.disabled = !S.backendOnline || (!S.llamaRunning && S.selectedModel === null) || (!S.llamaRunning && draftMissing) || capsBlocked;
  btn.classList.toggle('running', S.llamaRunning);
  document.getElementById('launch-icon').textContent = S.llamaRunning ? '■' : '▶';
  document.getElementById('launch-label').textContent = S.llamaRunning ? 'STOP' : 'LAUNCH';
  const banner = document.getElementById('caps-error-banner');
  if (capsBlocked && S.serverCapsPending) {
    banner.textContent = '⚠ Checking llama-server capabilities…';
    banner.style.display = 'block';
  } else if (capsBlocked && S.serverCapsError) {
    banner.textContent = '⚠ ' + S.serverCapsError;
    banner.style.display = 'block';
  } else if (draftMissing) {
    banner.textContent = '⚠ Draft model required for Draft speculative decoding.';
    banner.style.display = 'block';
  } else {
    banner.style.display = 'none';
  }
}
async function doLaunch() {
  if (S.selectedModel === null) return showToast('Select a model first.');
  let params;
  try {
    params = collectParams();
    const validation = validateParams(params);
    if (!validation.ok) return showToast(validation.error);
    if (validation.warning) showToast(validation.warning, 3500);
  } catch(e) { return showToast(e.message); }

  S.logOffset = 0;
  S.localLogs = [];
  switchTab('logs');

  try {
    renderLog();
    showProgress('LOADING MODEL', 'Sending launch command…');
    await apiFetch('/api/launch', { method: 'POST', body: JSON.stringify(params) });
    updateProgress(10, 'Waiting …');
    if (!(await apiFetch('/api/wait_llama', {}, 70000)).ok) throw new Error('llama-server health check timed out.');

    try {
      const st = await apiFetch('/api/status');
      applyStatus(st);
      updateBtn();
    } catch(_) {}
    document.getElementById('url-panel').classList.remove('hidden');
    updateUrlPanel(null);
    updateProgress(100, 'Done.');
    setTimeout(hideProgress, 700);
  } catch(e) {
    hideProgress();
    showToast('Launch failed: ' + e.message);
  }
}
async function doStop() {
  try {
    await apiFetch('/api/stop_llama', { method: 'POST' }, 45000);
    try {
      const st = await apiFetch('/api/status');
      applyStatus(st);
      updateBtn(); updateUrlPanel(st);
      document.getElementById('tab-params').classList.remove('locked');
    } catch(_) {}
  } catch(e) { showToast('Stop failed: ' + e.message); }
}
// ─── Command Preview ─────────────────────────────────────────────────────────

let _previewTimer = null;
function queueCommandPreview() {
  clearTimeout(_previewTimer);
  _previewTimer = setTimeout(updateCommandPreview, 350);
}
async function updateCommandPreview() {
  if (S.selectedModel === null || !S.backendOnline) {
    S.commandPreview = S.selectedModel === null ? 'Select a model to preview the launch command.' : 'Backend offline.';
    S.commandPreviewWarning = '';
    const box = document.getElementById('command-preview-box');
    if (box) box.textContent = S.commandPreview;
    return;
  }
  let params;
  try { params = collectParams(); }
  catch(e) {
    S.commandPreview = 'Cannot preview: ' + e.message;
    S.commandPreviewWarning = '';
    const box = document.getElementById('command-preview-box'); if (box) box.textContent = S.commandPreview;
    return;
  }
  try {
    const res = await apiFetch('/api/preview_command', { method:'POST', body: JSON.stringify(params) }, 10000);
    S.commandPreview = res.command || (res.cmd || []).join(' ');
    const warns = [];
    if (params.specType?.mode === 'custom' && !['off','auto','none'].includes(params.specType.value)) warns.push('Speculative decoding may be slower depending on model/backend/acceptance rate.');
    S.commandPreviewWarning = warns.join(' ');
  } catch(e) {
    S.commandPreview = 'Cannot preview: ' + e.message;
    S.commandPreviewWarning = '';
  }
  const box = document.getElementById('command-preview-box'); if (box) box.textContent = S.commandPreview;
  const warn = document.getElementById('command-preview-warning');
  if (warn) {
    warn.textContent = S.commandPreviewWarning;
    warn.style.display = S.commandPreviewWarning ? 'block' : 'none';
  }
}

// ─── Progress overlay ────────────────────────────────────────────────────────

let _progStart = 0, _progTick = null;
function showProgress(title, sub) {
  document.getElementById('prog-title').textContent = title;
  document.getElementById('prog-sub').textContent = sub;
  document.getElementById('prog-fill').style.width = '0%';
  document.getElementById('prog-elapsed').textContent = '';
  document.getElementById('progress-overlay').classList.add('visible');
  _progStart = Date.now();
  clearInterval(_progTick);
  _progTick = setInterval(() => {
    document.getElementById('prog-elapsed').textContent = ((Date.now() - _progStart) / 1000).toFixed(1) + 's elapsed';
  }, 100);
}
function updateProgress(pct, sub) {
  document.getElementById('prog-fill').style.width = pct + '%';
  if (sub) document.getElementById('prog-sub').textContent = sub;
}
function hideProgress() {
  clearInterval(_progTick);
  document.getElementById('progress-overlay').classList.remove('visible');
}

// ─── Static button wiring and dependencies ───────────────────────────────────

document.getElementById('browse-open-btn').addEventListener('click', () => openBrowser('model'));
document.getElementById('modal-close-btn').addEventListener('click', closeBrowser);
document.getElementById('modal-overlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeBrowser(); });
document.getElementById('params-content').addEventListener('click', e => {
  if (e.target.closest('#save-params-btn')) saveParams();
  if (e.target.closest('#clear-params-btn')) clearParameters();
});

function updateSpecDependencyState() {
  const spec = currentSpecType();
  document.querySelectorAll('[data-spec-scope]').forEach(row => {
    const scopes = (row.dataset.specScope || '').split(',').filter(Boolean);
    const enabled = P.specType?.mode === 'custom' && scopes.includes(spec);
    row.classList.toggle('disabled', !enabled);
  });
  document.getElementById('model-list')?.classList.toggle('show-draft-mode', spec === 'draft');
}
function updateOtherDependencyState() {
  // Other Parameters has no Custom gate. Text/JSON fields are enabled directly;
  // empty values are omitted from the launch command.
}
function setupParameterDependencies() {
  updateSpecDependencyState();
  updateOtherDependencyState();
}

// ─── Init ────────────────────────────────────────────────────────────────────

async function init() {
  if (!window.matchMedia('(min-width: 1024px)').matches) document.getElementById('tab-logs').style.display = 'none';
  await refreshServerCaps();
  try {
    const sys = await apiFetch('/api/system');
    if (sys.cpu_count) {
      if (P.threads) { P.threads.max = sys.cpu_count; P.threads.val = Math.max(1, Math.floor(sys.cpu_count / 2)); P.threads.defaultVal = P.threads.val; }
      if (P.threadsBatch) { P.threadsBatch.max = sys.cpu_count; P.threadsBatch.val = Math.max(1, Math.floor(sys.cpu_count / 2)); P.threadsBatch.defaultVal = P.threadsBatch.val; }
    }
  } catch(_) {}

  renderParams();
  await loadModels();
  const lastModel = localStorage.getItem('llamaCockpitSelectedModel');
  if (lastModel) {
    const idx = S.models.findIndex(m => m.path === lastModel);
    if (idx >= 0) await selectModel(idx);
  }
  try {
    const st = await apiFetch('/api/status');
    S.backendOnline = true;
    applyStatus(st);
    updateBtn();
    document.getElementById('pill-llama').classList.toggle('active', S.llamaRunning);
    updateUrlPanel(st);
    document.getElementById('tab-params').classList.toggle('locked', S.llamaRunning);
  } catch(_) {
    S.backendOnline = false;
    document.getElementById('topbar-title').classList.add('offline');
  }
  loopStatus();
  loopLogs();
  setInterval(() => {
    if (S.backendOnline) fetch(API + '/api/heartbeat', { method: 'POST' }).catch(err => console.debug('Heartbeat missed:', err));
  }, 2000);
}

init();
</script>
